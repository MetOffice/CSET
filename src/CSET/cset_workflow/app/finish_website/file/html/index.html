<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSET</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSET</h1>
  <p>Use the buttons to direct to preset search criteria.</p>

  <a href="viewer.html">Full list of diagnostics →</a>

<form id="preset-form">
  <fieldset>
    <legend>Surface fields</legend>
    <label><input type="checkbox" value='CATEGORY:surface' data-title="Surface"> All surface fields</label>
    <label><input type="checkbox" value='CATEGORY:surface AND aggregated' data-title="Surface: aggregated"> Aggregated</label>
  </fieldset>

  <fieldset>
    <legend>Pressure fields</legend>
    <label><input type="checkbox" value='CATEGORY:pressure' data-title="Pressure"> All pressure fields</label>
    <label><input type="checkbox" value='CATEGORY:pressure AND aggregated' data-title="Pressure: aggregated"> Aggregated</label>
  </fieldset>

  <fieldset>
    <legend>Model Level fields</legend>
    <label><input type="checkbox" value='CATEGORY:pressure' data-title="Pressure"> All pressure fields</label>
    <label><input type="checkbox" value='CATEGORY:pressure AND aggregated' data-title="Pressure: aggregated"> Aggregated</label>
  </fieldset>

  <fieldset>
    <legend>Verification</legend>
    <label><input type="checkbox" value='CATEGORY:scores' data-title="Pressure"> All pressure fields</label>
    <label><input type="checkbox" value='CATEGORY:pressure AND aggregated' data-title="Pressure: aggregated"> Aggregated</label>
  </fieldset>


  <button type="submit">Go</button>
</form>

<script>
  const form = document.getElementById("preset-form");
  form.addEventListener("submit", (event) => {
    // Stop the form doing its default "reload the page" behaviour.
    event.preventDefault();

    const ticked = form.querySelectorAll('input[type="checkbox"]:checked');

    // Nothing ticked: just open the viewer with everything.
    if (ticked.length === 0) {
      window.location.href = "viewer.html";
      return;
    }

    // Combine ticked boxes: show diagnostics matching ANY of them.
    let query = "";
    const titles = [];
    for (const box of ticked) {
      query = query ? `(${query}) OR (${box.value})` : box.value;
      titles.push(box.dataset.title);
    }

    window.location.href = "viewer.html?base=" + encodeURIComponent(query)
      + "&title=" + encodeURIComponent(titles.join(", "));
  });
</script>
