<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSET</h1>
  <p>Use the buttons to direct to preset search criteria.</p>

  <a href="viewer.html">Full list of diagnostics →</a>

<button type="button" class="preset" data-query='VARNAME:temperature'>Temperature</button>
<button type="button" class="preset" data-query='case_date="20250815T0000Z"'>20250815T0000Z</button>
<button type="button" class="preset"
        data-query='case_date="20250815T0000Z" OTHER_MODEL="cci"'
        data-title="15 Aug 2025 case: CCI vs control">20250815T0000Z + cci</button>

<script>
  document.querySelectorAll(".preset").forEach(btn =>
    btn.addEventListener("click", () => {
      window.location.href = "viewer.html?base=" + encodeURIComponent(btn.dataset.query)
        + "&title=" + encodeURIComponent(btn.dataset.title || btn.textContent);
    })
  );
</script>
</body>
</html>
