[config]
# Rainfields3 radar-based quantitative precipitation estimates

OBTYPE = Rainfields3
RADAR_ID = {ENV[RAINFIELDS3_SITE]}

OBS_VAR1_NAME = APCP

# PcpCombine OBS
#
OBS_PCP_COMBINE_RUN = True
OBS_PCP_COMBINE_METHOD = ADD

OBS_PCP_COMBINE_INPUT_DIR =
OBS_PCP_COMBINE_INPUT_TEMPLATE = PYTHON_NUMPY
OBS_PCP_COMBINE_INPUT_DATATYPE = PYTHON_NUMPY
OBS_PCP_COMBINE_INPUT_NAMES = nci-gadi/read_rainfields.py {valid?fmt=%Y%m%d_%H%M} {RADAR_ID}
OBS_PCP_COMBINE_INPUT_ACCUMS = 15M

OBS_PCP_COMBINE_OUTPUT_DIR = {OUTPUT_BASE}
OBS_PCP_COMBINE_OUTPUT_TEMPLATE = {OBTYPE}.{RADAR_ID}.{valid?fmt=%Y%m%d_%H%M}_A{VERIFY_ACCUM_H}.nc
OBS_PCP_COMBINE_OUTPUT_NAME = {OBS_VAR1_NAME}
OBS_PCP_COMBINE_OUTPUT_ACCUM = {VERIFY_ACCUM_H}H

# GridStat
#
OBS_GRID_STAT_INPUT_DIR = {OBS_PCP_COMBINE_OUTPUT_DIR}
OBS_GRID_STAT_INPUT_TEMPLATE = {OBS_PCP_COMBINE_OUTPUT_TEMPLATE}
OBS_GRID_STAT_VAR1_LEVELS = A{VERIFY_ACCUM_H}
OBS_GRID_STAT_VAR1_OPTIONS = is_precipitation = TRUE;

# The mask file gets generated by the python read script, it is only used for naming the radar
GRID_STAT_MASK_GRID =
GRID_STAT_MASK_POLY = mask_{RADAR_ID}.poly
