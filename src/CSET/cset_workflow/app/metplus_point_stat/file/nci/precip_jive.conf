# Perform verification against rain gauges from JIVE

[config]
POINT_STAT_MESSAGE_TYPE = ADPSFC
POINT_STAT_DESC = JIVE

LEAD_SEQ = begin_end_incr(6,{ENV[FORECAST_LENGTH]},{ENV[METPLUS_PRECIP_OBS_ACCUM]})

OBS_POINT_STAT_INPUT_DIR = /g/data/dp9/verification/data/met/jive/precip
OBS_POINT_STAT_INPUT_TEMPLATE = JIVE_APCP_A{ENV[METPLUS_PRECIP_OBS_ACCUM]}_{valid?fmt=%Y}.nc

FCST_POINT_STAT_INPUT_TEMPLATE = {ENV[MODEL_ID]}_precip.nc
FCST_POINT_STAT_VAR1_NAME = {ENV[METPLUS_PRECIP_FCST_VARIABLE]}
FCST_POINT_STAT_VAR1_LEVELS = "({valid?fmt=%Y%m%d_%H%M%S},*,*)"
FCST_POINT_STAT_VAR1_OPTIONS = is_precipitation = TRUE;

OBS_POINT_STAT_VAR1_NAME = APCP
OBS_POINT_STAT_VAR1_LEVELS = A{ENV[METPLUS_PRECIP_OBS_ACCUM]}

BOTH_POINT_STAT_VAR1_THRESH = >=0.2,>=1.0,>=4.0,>=8.0,>=12.0

OBS_POINT_STAT_WINDOW_BEGIN = -0
OBS_POINT_STAT_WINDOW_END = 0

POINT_STAT_OUTPUT_FLAG_CNT = BOTH

