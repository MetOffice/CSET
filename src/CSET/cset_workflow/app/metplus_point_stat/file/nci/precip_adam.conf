# Perform verification against rain gauges from ADAM
#

[config]
PROCESS_LIST = PcpCombine, PointStat

FCST_ACCUM_H = {ENV[METPLUS_PRECIP_FCST_ACCUM_H]}
VERIFY_ACCUM_H = {ENV[METPLUS_PRECIP_VERIFY_ACCUM_H]}

LEAD_SEQ = begin_end_incr({VERIFY_ACCUM_H}, {ENV[FORECAST_LENGTH]}, {VERIFY_ACCUM_H})

FCST_PCP_COMBINE_INPUT_NAMES = {ENV[METPLUS_PRECIP_FCST_VARIABLE]}

# PcpCombine FCST
#
PCP_COMBINE_SKIP_IF_OUTPUT_EXISTS = True

FCST_PCP_COMBINE_RUN = True
FCST_PCP_COMBINE_METHOD = ADD

FCST_PCP_COMBINE_INPUT_DIR = {ENV[METPLUS_FCST_DIR]}
FCST_PCP_COMBINE_INPUT_TEMPLATE = {ENV[MODEL_ID]}_precip.nc
FCST_PCP_COMBINE_INPUT_LEVELS = "({valid?fmt=%Y%m%d_%H%M%S},*,*)"
FCST_PCP_COMBINE_INPUT_ACCUMS = {FCST_ACCUM_H}H

FCST_PCP_COMBINE_OUTPUT_DIR = {OUTPUT_BASE}
FCST_PCP_COMBINE_OUTPUT_TEMPLATE = {ENV[MODEL_ID]}.{init?fmt=%Y%m%d_%H%M}_L{lead?fmt=%HHH}_A{VERIFY_ACCUM_H}.nc
FCST_PCP_COMBINE_OUTPUT_NAME = {FCST_PCP_COMBINE_INPUT_NAMES}
FCST_PCP_COMBINE_OUTPUT_ACCUM = {VERIFY_ACCUM_H}H

# PointStat
#
POINT_STAT_MESSAGE_TYPE = ADPSFC

OBS_POINT_STAT_INPUT_DIR = /g/data/dp9/verification/data/met/jive/precip
OBS_POINT_STAT_INPUT_TEMPLATE = JIVE_APCP_A{VERIFY_ACCUM_H}_{valid?fmt=%Y}.nc

OBS_POINT_STAT_VAR1_NAME = APCP
OBS_POINT_STAT_VAR1_LEVELS = A{VERIFY_ACCUM_H}

FCST_POINT_STAT_INPUT_DIR = {FCST_PCP_COMBINE_OUTPUT_DIR}
FCST_POINT_STAT_INPUT_TEMPLATE = {FCST_PCP_COMBINE_OUTPUT_TEMPLATE}
FCST_POINT_STAT_VAR1_NAME = {FCST_PCP_COMBINE_OUTPUT_NAME}
FCST_POINT_STAT_VAR1_LEVELS = "(*,*)"
FCST_POINT_STAT_VAR1_OPTIONS = is_precipitation = TRUE;

BOTH_POINT_STAT_VAR1_THRESH = >=0.2,>=1.0,>=4.0,>=8.0,>=12.0

OBS_POINT_STAT_WINDOW_BEGIN = -0
OBS_POINT_STAT_WINDOW_END = 0

POINT_STAT_OUTPUT_FLAG_CNT = BOTH
