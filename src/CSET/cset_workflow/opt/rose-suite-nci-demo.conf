# Demonstrate CSET with different observation types at NCI
#
# Run the demo with
#
#    cylc vip -O nci-demo

[env]
PROJECT=dp9

[template variables]
SITE = "nci-gadi"
SKIP_WRITE = True
WEB_DIR = "~/public_html/$CYLC_WORKFLOW_NAME"

ANALYSIS_LENGTH = "PT24H"

CSET_CASE_DATES = ["20240529T0000Z"]

# Plots
SPATIAL_SURFACE_FIELD = True
RUN_METPLUS_POINT_STAT = True

# Metplus configuration
METPLUS_OBS_SYSTEM = "access_c3_vt"
METPLUS_VERIFY_PRECIP = True
METPLUS_PRECIP_FCST_VARIABLE = "stratiform_rainfall_flux"
METPLUS_PRECIP_FCST_ACCUM = "PT1H"
METPLUS_PRECIP_VERIFY_ACCUM = "PT3H"

# Fields to run through CSET
SURFACE_FIELDS = ["temperature_at_screen_level"]

# Model data files
CSET_MODEL_COUNT = 1

m1_name = "UM"
m1_data_path = "/g/data/dp9/verification/data/sample/cset/%Y%m%dT%H00Z/1p5km/melb/ral3p3/um/*pdiaga%N"
m1_data_source = "filesystem"
m1_date_type="initiation"
m1_data_period="PT12H"
m1_analysis_offset="PT0H"

