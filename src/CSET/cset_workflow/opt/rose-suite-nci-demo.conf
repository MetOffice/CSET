# Test CSET with different observation types at NCI
#
# Run tests with
#    cylc vip -O nci-test

[env]
PROJECT=dp9

[template variables]
SITE = "nci-gadi"
SKIP_WRITE = True
WEB_DIR = "~/public_html/$CYLC_WORKFLOW_NAME"

ANALYSIS_LENGTH = "PT24H"

CSET_MODEL_COUNT = 3
CSET_CASE_DATES = ["20240529T0000Z"]

VERPY_DIR = "~scwales/repos/verpy"

# Plots
SPATIAL_SURFACE_FIELD = True
RUN_METPLUS_POINT_STAT = True

METPLUS_OBS_SYSTEM = "access_c3_vt"
SURFACE_FIELDS = ["temperature_at_screen_level"]

m1_name = "UM"
m1_data_path = "/g/data/dp9/verification/data/sample/cset/%Y%m%dT%H00Z/1p5km/melb/ral3p3/um/*pdiaga%N"
m1_data_source = "filesystem"
m1_date_type="initiation"
m1_data_period="PT12H"
m1_analysis_offset="PT0H"
m1_metplus_map={'TEMP': 'temperature_at_screen_level'}

m2_name = "LFRic"
m2_data_path = "/g/data/dp9/verification/data/sample/cset/%Y%m%dT%H00Z/1p5km/melb/ral3p3/lfric/*_diagnostics_%N_???.nc"
m2_data_source = "filesystem"
m2_date_type="initiation"
m2_data_period="PT12H"
m2_analysis_offset="PT0H"
m2_source_model="LFRic"
m2_metplus_map={'TEMP': 'temperature_at_screen_level'}
