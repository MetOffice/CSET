################################################################################
# Verification
################################################################################

[Verification]
ns=Verification
sort-key=sec-e
title=Verification

[template variables=RUN_METPLUS_POINT_STAT]
ns=Verification
description=Run METplus point stat in the workflow.
help=If True, it will enable the production of verification statistics against
    point observations (i.e. land-synop, sonde,...).
type=python_boolean
trigger=template variables=METPLUS_OPT_CONFIG_KEYS: True;
        template variables=METPLUS_OBS_DIR: True;
compulsory=true
sort-key=met1

[template variables=RUN_METPLUS_GRID_STAT]
ns=Verification
description=Run METplus grid stat in the workflow.
help=If True, it will enable the production of verification statistics against
    gridded data (i.e. radar, analysis,...).
type=python_boolean
trigger=template variables=METPLUS_OPT_CONFIG_KEYS: True;
        template variables=METPLUS_ANA_DIR: True;
compulsory=true
sort-key=met2

[template variables=METPLUS_OPT_CONFIG_KEYS]
ns=Verification
description=Which METplus configuration to run.
help=Selects the site/model specific configuration to use. The configuration must
    exist as restricted files in
    https://github.com/MetOffice/CSET-restricted-files/tree/main/app/{app_name}/file
type=quoted
value-hints="metoffice", "niwa", "nci-gadi"
sort-key=met3

[template variables=METPLUS_OBS_DIR]
ns=Verification
description=Path to directory containing observations in MET ASCII format.
type=quoted
sort-key=met4

[template variables=METPLUS_ANA_DIR]
ns=Verification
description=Path to directory containing analysis in MET netcdf format.
type=quoted
sort-key=met5


###################################
# Scores
[Verification/Scores]
ns=Verification/Scores
sort-key=scores
title=Scores

[template variables=SCORES_RMSE_SPATIAL]
ns=Verification/Scores
description=Create spatially mapped RMSE plots for the specified surface fields.
            The analysis method(s) set in SPATIAL_SURFACE_FIELD_METHOD will be used.
type=python_boolean
compulsory=true
sort-key=scores1

[template variables=SCORES_RMSE_TIMESERIES]
ns=Verification/Scores
description=Create a timeseries of the RMSE for the specified surface fields.
type=python_boolean
compulsory=true
sort-key=scores2

####################################
# Ensembles

[template variables=DFSS]
ns=verification/Ensembles/dFSS and eFSS
title=dFSS
description=Ensemble based dFSS method
help=Triggers options for dFSS
type=python_boolean
trigger=template variables=CENTILE_OR_THRESHOLD: True;
        template variables=THRESHOLD: True;
        template variables=CENTILE: True;
        template variables=NEIGHBOURHOOD_LENGTHS: True;
compulsory=true
sort-key=dfss1

[template variables=CENTILE_OR_THRESHOLD]
ns=verification/Ensembles/dFSS and eFSS
title=CENTILE OR THRESHOLD
description=Choose whether to use the centile or threshold method for dFSS
help=Triggers either prompt to give a real value for centile or threshold
values="centile", "threshold"
trigger=template variables=CENTILE: "centile";
        template variables=THRESHOLD: "threshold";
compulsory=true
sort-key=dfss2

[template variables=THRESHOLD]
ns=verification/Ensembles/dFSS and eFSS
title=Threshold
description=Threshold for dFSS calculation
help=Real valued threshold
type=real
compulsory=true
sort-key=dfss3

[template variables=CENTILE]
ns=verification/Ensembles/dFSS and eFSS
title=Centile
description=Centile for dFSS calculation
help=Real valued centile
type=real
compulsory=true
sort-key=dfss4

[template variables=NEIGHBOURHOOD_LENGTHS]
ns=verification/Ensembles/dFSS and eFSS
title=Neighbourhood lengths
description=List of neighbourhood lengths
help=A list of integers representing the size of the neighbourhoods to use
type=python_list
compulsory=true
compulsory=true
sort-key=dfss5
