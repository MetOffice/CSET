category: Hinton
title: ('temperature_at_screen_level',) scores rmse Hinton for model vs 
  observation points UK_domain
description: TODO experimental
steps:
  - operator: read.read_cubes
    file_paths:
      - /home/users/james.warner/cylc-run/cset_workflow/run17/share/cycle/*/data/OBS
      - /home/users/james.warner/cylc-run/cset_workflow/run17/share/cycle/*/data/1
      - /home/users/james.warner/cylc-run/cset_workflow/run17/share/cycle/*/data/2
    model_names: &id002
      - OBS
      - UM
      - LF
    constraint:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname:
          - temperature_at_screen_level
          - observed_temperature_at_screen_level
      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: []
      pressure_level_constraint:
        operator: constraints.generate_level_constraint
        coordinate: pressure
        levels: []
    subarea_type: realworld
    subarea_extent: &id003
      - 50
      - 55
      - -6
      - 2

  - operator: misc.combine_cubes_into_cubelist
    first:
      operator: aggregate.combine_obs_across_forecasts
      cubes:
        operator: filters.filter_multiple_cubes
        constraint:
          operator: constraints.generate_var_constraint
          varname: observed_temperature_at_screen_level

    second:     
      operator: aggregate.ensure_aggregatable_across_cases
      cubes:
        operator: filters.filter_multiple_cubes
        constraint:
          operator: constraints.generate_var_constraint
          varname: temperature_at_screen_level
          

  - operator: misc.extract_common_points
    coordinate: forecast_period
          
  - operator: misc.combine_cubes_into_cubelist
    first:
      operator: filters.filter_cubes
      constraint:
        operator: constraints.generate_var_constraint
        varname: observed_temperature_at_screen_level

    second:
      operator: regrid.interpolate_to_point_cube

      fld:
        operator: filters.filter_multiple_cubes
        constraint:
          operator: constraints.combine_constraints
          var_constraint:
            operator: constraints.generate_var_constraint
            varname: temperature_at_screen_level

      point_cube:
        operator: filters.filter_cubes
        constraint:
          operator: constraints.generate_var_constraint
          varname: observed_temperature_at_screen_level




















