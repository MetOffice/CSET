<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        body {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin: 0;
            font-family: sans-serif;
        }

        input:invalid {
            box-shadow: 0 0 2px 2px red;
        }

        .hidden {
            display: none !important;
        }

        .visually-hidden {
            position: absolute;
            left: -9999px;
        }

        main {
            flex: 30em;
            height: 100vh;
        }

        main>img {
            width: 100%;
            height: calc(100% - 3em);
            object-fit: contain;
        }

        #sequence_controls {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.5em 0;
            border: none;
            padding: 0;
        }

        #sequence_controls input[type="number"] {
            width: 6em;
        }

        #sequence_controls input[type="range"] {
            width: min(60em, calc(100% - 16em));
            margin: 0 1em;
        }

        #description-container {
            flex: 20em;
            max-height: calc(100vh - min(1em, 5vh));
            max-width: 50em;
            margin: min(1em, 5vh);
            padding: 0 1em;
            background-color: whitesmoke;
            box-shadow: 4px 4px 4px grey;
            outline: darkgrey solid 1px;
            overflow: auto;
        }
    </style>
    <script type="module">
    "use strict";

    const plot_index = {{plots}};
    const tar_url = "plots.tar";
    const plot_cache = new Map();

    // Fetch one plot's bytes from the tar using a Range request.
    async function get_plot_url(i) {
        if (plot_cache.has(i)) return plot_cache.get(i);
        const [name, start, size] = plot_index[i];
        const resp = await fetch(tar_url, {
            headers: { Range: `bytes=${start}-${start + size - 1}` },
        });
        if (resp.status !== 206) {
            throw new Error(`Expected partial content (206), got ${resp.status}`);
        }
        const type = name.endsWith(".svg") ? "image/svg+xml" : "image/png";
        const url = URL.createObjectURL(new Blob([await resp.blob()], { type }));
        plot_cache.set(i, url);
        return url;
    }

    async function show_plot(i) {
        try {
            document.querySelector("#plot").src = await get_plot_url(i);
        } catch (err) {
            console.error(`Failed to load plot ${i + 1}:`, err);
            return;
        }
        [i - 1, i + 1]
            .filter(j => j >= 0 && j < plot_index.length)
            .forEach(j => get_plot_url(j).catch(() => {}));
    }

    function update_displayed_plot(event) {
        show_plot(event.target.value - 1);
    }

    function display_sequence_controls(plot_urls) {
        // Only show sequence controls if there are multiple plots.
        if (plot_urls == undefined || plot_urls.length < 2) {
            return;
        }

        // Wire up the controls.
        const sequence_range = document.querySelector("#sequence_range");
        sequence_range.max = plot_urls.length;
        sequence_range.addEventListener("input", () => {
            sequence_number.value = sequence_range.value;
        });
        sequence_range.addEventListener("input", update_displayed_plot);

        const sequence_number = document.querySelector("#sequence_number");
        sequence_number.max = plot_urls.length;
        sequence_number.addEventListener("input", () => {
            sequence_range.value = sequence_number.value;
        });
        sequence_number.addEventListener("change", update_displayed_plot);

        // Display sequence controls.
        const sequence_controls = document.querySelector("#sequence_controls");
        sequence_controls.classList.remove("hidden");
    }

    display_sequence_controls(plot_index);
    await show_plot(0);
</script>
</head>

<body>
    <main>
        <fieldset id="sequence_controls" class="hidden">
            <label for="sequence_range">Select plot:</label>
            <label class="visually-hidden" for="sequence_number">Select plot</label>
            <input type="range" id="sequence_range" value="1" min="1" max="1">
            <input type="number" id="sequence_number" value="1" min="1" max="1">
        </fieldset>
        <img id="plot" alt="plot">
    </main>
    <aside id="description-container">
        <h1>{{title}}</h1>
        {{description}}
        <hr>
        <p><a href="plots.tar" download="{{title_slug}}.tar">💾 Save plots</a></p>
        <p><a href="{{title_slug}}.nc" download="{{title_slug}}.nc">💾 Save data file</a></p>
        <p><a href="CSET.log" download="{{title_slug}}.CSET.log">💾 Save CSET log file</a></p>
    </aside>
</body>
