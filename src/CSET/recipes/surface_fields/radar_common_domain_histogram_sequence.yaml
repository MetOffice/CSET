category: Surface Spatial Plot
title: "bmc8b Histogram $VARNAME\n common domain model and radar $NIMROD_LABEL"
description: |
  Creates time sequence histograms of the model rainfall rate and
  the observed radar rainfall rate. The model field is regridded onto
  the radar grid. Both regridded model and radar grids are then masked
  so that only data within a domain common to both are used.

steps:
  - operator: read.read_cubes
    file_paths: $INPUT_PATHS
    model_names: $ALL_LABEL
    subarea_type: $SUBAREA_TYPE
    subarea_extent: $SUBAREA_EXTENT
    constraint: [$VARNAME, "Hourly rain accumulation", "Hourly wts accumulation"]

  - operator: radar_filter.radar_mask_loop
    model_field:
      operator: filters.filter_multiple_cubes
      constraint:
        operator: constraints.combine_constraints
        varname_constraint:
          operator: constraints.generate_var_constraint
          varname: $VARNAME
        cell_methods_constraint:
          operator: constraints.generate_cell_methods_constraint
          cell_methods: []
          varname: $VARNAME
        pressure_level_constraint:
          operator: constraints.generate_level_constraint
          coordinate: "pressure"
          levels: []

    nimrod_field:
      operator: filters.filter_multiple_cubes
      constraint:
        operator: constraints.generate_var_constraint
        varname: "Hourly rain accumulation"

    nimrod_mask:
      operator: filters.generate_mask
      mask_field:
        operator: filters.filter_multiple_cubes
        constraint:
          operator: constraints.generate_var_constraint
          varname: "Hourly wts accumulation"
      condition: 'ge'
      value: 11

    boundary_margin: 16
    outputs: $OUTPUTS

  - operator: radar_filter.match_varname_and_units

  - operator: write.write_cube_to_nc
    overwrite: True

  - operator: plot.plot_histogram_series
    sequence_coordinate: $SEQUENCE
