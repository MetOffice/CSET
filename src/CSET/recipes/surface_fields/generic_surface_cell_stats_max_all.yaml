category: Cellstats
title: "Feature max $VARNAME over all times.\n Threshold $CELLTRACK_THRESHOLD (under_threshold = $CELLTRACK_UNDER_THRESHOLD)"
description: |
  Uses the cell_stats operator to calculate max intensity values for identified features.
  Each cell is identified as a minimum contiguous region of grid points (typically at least 4) that exceeds a threshold value.
  Max intensity is then derived for each identified cell.
  Follows the approach of Hanley, Kirsty E., et al. ‘Mixing-Length Controls on High-Resolution Simulations of Convective Storms’. QJRMS (2015): https://doi.org/10.1002/qj.2356.
  Saves cell stats data to output and plots histograms

steps:
  - operator: read.read_cubes
    file_paths: $INPUT_PATHS
    model_names: $MODEL_NAME

  - operator: filters.filter_multiple_cubes
    constraint:
      operator: constraints.combine_constraints
      variable_constraint:
        operator: constraints.generate_var_constraint
        varname: $VARNAME
      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: []
        varname: $VARNAME

  - operator: feature.cell_stats
    threshold: $CELLTRACK_THRESHOLD
    min_size: $CELLTRACK_MIN_SIZE
    under_threshold: $CELLTRACK_UNDER_THRESHOLD

  - operator: filters.filter_multiple_cubes
    constraint:
      operator: constraints.generate_var_constraint
      varname: feature_max

  - operator: plot.plot_histogram_series
    sequence_coordinate: realization
