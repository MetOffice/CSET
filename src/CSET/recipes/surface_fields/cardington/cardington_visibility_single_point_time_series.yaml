category: Time series of $PLOT_VARNAME at single point
title: "Time series of $PLOT_VARNAME at Cardington [52.10438N, -0.42286E]."
description: "Plots a time series of $PLOT_VARNAME at gridpoint nearest to Cardington."

steps:
  - operator: read.read_cubes
    file_paths: $INPUT_PATHS
    model_names:
      - $OBS_NAME
      - $MODEL_NAME

  - operator: filters.filter_multiple_cubes
    Cardington:
      operator: constraints.generate_var_constraint
      varname: $OBS_VARNAME

    $MODEL_NAME:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname: $VARNAME
      pressure_level_constraint:
        operator: constraints.generate_level_constraint
        levels: []
        coordinate: "pressure"
      stash_constraint:
        operator: constraints.generate_attribute_constraint
        attribute: STASH

  - operator: misc.convert_units
    units: km

  - operator: regrid.regrid_to_single_point
    lat_pt: 52.10438
    lon_pt: -0.42286
    latlon_in_type: "realworld"
    method: "Nearest"
    boundary_margin: 0

  - operator: write.write_cube_to_nc
    overwrite: True

  - operator: plot.plot_line_series
    ymin: 0
