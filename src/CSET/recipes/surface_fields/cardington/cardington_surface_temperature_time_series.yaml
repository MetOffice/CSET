category: Time series of surface temperature at single point
title: "Time series of surface temperature at Cardington [52.10438N, -0.42286E]"
description: "Plots a time series of surface temperature at gridpoint nearest to Cardington."
steps:
  - operator: read.read_cubes
    file_paths: $INPUT_PATHS
    model_names:
      - $OBS_NAME
      - $OBS_TWO_NAME
      - $MODEL_NAME
    constraint:
      - $OBS_VARNAME
      - $STASH

  - operator: misc.remove_attribute
    attribute:
      - time_coverage_end
      - time_coverage_start
      - valid_min
      - valid_max
      - date
      - date_created

  - operator: misc.remove_scalar_coords
    coords:
      - forecast_reference_time
      - realization

  - operator: filters.apply_mask
    mask:
      operator: filters.generate_mask
      condition: 'lt'
      value: 1.0e+10

  - operator: filters.filter_multiple_cubes
    Cardington:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname: $OBS_VARNAME
      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: [ ]
        varname: $OBS_VARNAME

    UM:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname: $VARNAME

      stash_constraint:
        operator: constraints.generate_attribute_constraint
        attribute: STASH
        values:
        - $STASH

      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: []
        varname: $VARNAME

  - operator: misc.convert_units
    units: 'Celsius'

  - operator: regrid.regrid_to_single_point
    lat_pt: 52.10438
    lon_pt: -0.42286
    latlon_in_type: "realworld"
    method: "Nearest"
    boundary_margin: 0

  - operator: write.write_cube_to_nc
    overwrite: True

  - operator: plot.plot_line_series
