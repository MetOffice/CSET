category: Scatter plot of total net radiation at single point
title: "Scatter of total net radiation at Cardington [52.10438N, -0.42286E]"
description: "Scatter plot of model total net radiation (SW + LW) against observed net radiation at gridpoint nearest to Cardington."

steps:
  - operator: read.read_cubes
    preserve_attributes: [height]
    file_paths: $INPUT_PATHS
    model_names:
      - $OBS_NAME
      - $MODEL_NAME
    constraint:
      - $OBS_SW_DN
      - $OBS_SW_UP
      - $OBS_LW_DN
      - $OBS_LW_UP
      - $MODEL_SW
      - $MODEL_LW

  - operator: filters.apply_mask
    mask:
       operator: filters.generate_mask
       condition: 'lt'
       value: 1.0e+10

  - operator: misc.combine_cubes_into_cubelist
    first:
      operator: misc.rename_cube
      name: net_downward_radiative_flux
      cubes:
        operator: fluxes.add_fluxes
        flux_a:
          operator: fluxes.net_radiative_flux
          downwelling_flux:
            operator: filters.filter_multiple_cubes
            constraint:
              operator: constraints.combine_constraints
              varname_constraint:
                operator: constraints.generate_var_constraint
                varname: $OBS_SW_DN
              height_constraint:
                operator: constraints.generate_attribute_constraint
                attribute: height
                value: $OBS_HEIGHT
          upwelling_flux:
            operator: filters.filter_multiple_cubes
            constraint:
              operator: constraints.combine_constraints
              varname_constraint:
                operator: constraints.generate_var_constraint
                varname: $OBS_SW_UP
              height_constraint:
                operator: constraints.generate_attribute_constraint
                attribute: height
                value: $OBS_HEIGHT
        flux_b:
          operator: fluxes.net_radiative_flux
          downwelling_flux:
            operator: filters.filter_multiple_cubes
            constraint:
              operator: constraints.combine_constraints
              varname_constraint:
                operator: constraints.generate_var_constraint
                varname: $OBS_LW_DN
              height_constraint:
                operator: constraints.generate_attribute_constraint
                attribute: height
                value: $OBS_HEIGHT
          upwelling_flux:
            operator: filters.filter_multiple_cubes
            constraint:
              operator: constraints.combine_constraints
              varname_constraint:
                operator: constraints.generate_var_constraint
                varname: $OBS_LW_UP
              height_constraint:
                operator: constraints.generate_attribute_constraint
                attribute: height
                value: $OBS_HEIGHT

    second:
      operator: fluxes.add_fluxes
      flux_a:
        operator: filters.filter_multiple_cubes
        constraint:
          operator: constraints.combine_constraints
          model_name_constraint:
            operator: constraints.generate_attribute_constraint
            attribute: model_name
            value: $MODEL_NAME
          varname_constraint:
            operator: constraints.generate_var_constraint
            varname: $MODEL_SW
          cell_methods_constraint:
            operator: constraints.generate_cell_methods_constraint
            cell_methods: []
            varname: $MODEL_SW
      flux_b:
        operator: filters.filter_multiple_cubes
        constraint:
          operator: constraints.combine_constraints
          model_name_constraint:
            operator: constraints.generate_attribute_constraint
            attribute: model_name
            value: $MODEL_NAME
          varname_constraint:
            operator: constraints.generate_var_constraint
            varname: $MODEL_LW
          cell_methods_constraint:
            operator: constraints.generate_cell_methods_constraint
            cell_methods: []
            varname: $MODEL_LW

  - operator: regrid.regrid_to_single_point
    lat_pt: 52.10438
    lon_pt: -0.42286
    latlon_in_type: "realworld"
    method: "Nearest"
    boundary_margin: 0

  - operator: plot.plot_scatter_comparison
