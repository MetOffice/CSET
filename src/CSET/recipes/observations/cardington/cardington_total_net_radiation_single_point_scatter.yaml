category: Scatter plot of total net radiation at single point
title: "Scatter of total net radiation at Cardington [52.10438N, -0.42286E]"
description: "Scatter plot of model total net radiation (SW + LW) against observed net radiation at gridpoint nearest to Cardington."

steps:
  - operator: read.read_cubes
    preserve_attributes: [height]
    file_paths: $INPUT_PATHS
    model_names:
      - Cardington_obs
      - RAL3LFRic_model
    constraint:
      - net_radiation_down
      - surface_net_shortwave_flux
      - surface_net_longwave_flux

  - operator: filters.apply_mask
    mask:
       operator: filters.generate_mask
       condition: 'lt'
       value: 1.0e+10

  - operator: filters.filter_multiple_cubes
    Cardington_obs:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname: net_radiation_down
      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: []
        varname: net_radiation_down

    RAL3LFRic_model:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname: surface_net_shortwave_flux
      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: []
        varname: surface_net_shortwave_flux
      pressure_level_constraint:
            operator: constraints.generate_level_constraint
            levels: [ ]
            coordinate: "pressure"

  - operator: filters.filter_multiple_cubes
    RAL3LFRic_model:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname: surface_net_longwave_flux
      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: []
        varname: surface_net_longwave_flux
      pressure_level_constraint:
            operator: constraints.generate_level_constraint
            levels: [ ]
            coordinate: "pressure"

  - operator: fluxes.add_fluxes

  - operator: regrid.regrid_to_single_point
    lat_pt: 52.10438
    lon_pt: -0.42286
    latlon_in_type: "realworld"
    method: "Nearest"
    boundary_margin: 0

  - operator: plot.plot_scatter_comparison
