category: observations
observation_type: cardington
plot_type: time series
title: "Time series of $OBS_HEIGHT m $PLOT_VARNAME flux at Cardington [52.10438N, -0.42286E]"
description: "Plots a time series of $PLOT_VARNAME at gridpoint nearest to Cardington."
steps:
  - operator: read.read_cubes
    preserve_attributes: [height]
    file_paths: $INPUT_PATHS
    model_names:
      - $OBS_NAME
      - $MODEL_NAME
    constraint:
      - $WT_VARNAME
      - $AIR_TEMP_VARNAME
      - $PRESSURE_VARNAME
      - $VARNAME

  - operator: filters.apply_mask
    mask:
       operator: filters.generate_mask
       condition: 'lt'
       value: 1.0e+10

  - operator: misc.combine_cubes_into_cubelist

    first:
      operator: misc.rename_cube
      cubes:
        operator: fluxes.sensible_heat_flux_from_covariance
        wt_flux:
          operator: filters.filter_multiple_cubes
          constraint:
            operator: constraints.generate_var_constraint
            varname: $WT_VARNAME

        air_temperature:
          operator: filters.filter_multiple_cubes
          constraint:
            operator: constraints.generate_var_constraint
            varname: $AIR_TEMP_VARNAME

        pressure:
          operator: filters.filter_multiple_cubes
          constraint:
            operator: constraints.generate_var_constraint
            varname: $PRESSURE_VARNAME

      name: surface_upward_sensible_heat_flux_obs

    second:
      operator: filters.filter_multiple_cubes
      constraint:
        operator: constraints.combine_constraints

        varname_constraint:
          operator: constraints.generate_var_constraint
          varname: $VARNAME

        model_constraint:
          operator: constraints.generate_attribute_constraint
          attribute: model_name
          value: $MODEL_NAME

  - operator: regrid.regrid_to_single_point
    lat_pt: 52.10438
    lon_pt: -0.42286
    latlon_in_type: "realworld"
    method: "Nearest"
    boundary_margin: 0

  - operator: write.write_cube_to_nc
    overwrite: True

  - operator: plot.plot_line_series
