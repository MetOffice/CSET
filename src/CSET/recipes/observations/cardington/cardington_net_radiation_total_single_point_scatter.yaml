category: Scatter plot of $PLOT_VARNAME at single point
title: "Scatter of $PLOT_VARNAME at Cardington [52.10438N, -0.42286E]"
description: "Scatter plot of model against observed net downward radiative flux at gridpoint nearest to Cardington."

steps:
  - operator: read.read_cubes
    preserve_attributes: [height]
    file_paths: $INPUT_PATHS
    model_names:
      - $OBS_NAME
      - $MODEL_NAME
    constraint:
      - $OBS_VARNAME
      - $MODEL_VARNAME

  - operator: filters.apply_mask
    mask:
       operator: filters.generate_mask
       condition: 'lt'
       value: 1.0e+10

  - operator: filters.filter_multiple_cubes
    $OBS_NAME:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname: $OBS_VARNAME

    $MODEL_NAME:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname: $MODEL_VARNAME
      pressure_level_constraint:
            operator: constraints.generate_level_constraint
            levels: [ ]
            coordinate: "pressure"

  - operator: regrid.regrid_to_single_point
    lat_pt: 52.10438
    lon_pt: -0.42286
    latlon_in_type: "realworld"
    method: "Nearest"
    boundary_margin: 0

  - operator: plot.plot_scatter_comparison
