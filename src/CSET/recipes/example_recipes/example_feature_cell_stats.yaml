category: Quick Look
title: Example running cell_stats and plotting histograms
description: |
  Uses the cell_stats operator to calculate cell size, mean cell values and max cell values for identified features.
  Each cell is identified as a minimum contiguous region of grid points (typically at least 4) that exceeds a threshold value.
  Max/mean intensity and size properties are then derived for each identified cell.
  Cell effective diameter (km) is calculated as the diameter of a circle with the same area as the cell.
  Conversion from grid points to physical units is performed using coordinate metadata, assuming horizontal coordinates have a regular step.
  If horizontal coordinates are in degrees, the mean latitude is used to estimate a constant grid spacing using: dy * 111km * cos(mean_latitude).
  Follows the approach of Hanley, Kirsty E., et al. ‘Mixing-Length Controls on High-Resolution Simulations of Convective Storms’. QJRMS (2015): https://doi.org/10.1002/qj.2356.
  Saves cell stats data to output and plots histograms

steps:
  - operator: read.read_cubes
    file_paths: $INPUT_PATHS
    model_names: $MODEL_NAME

  - operator: filters.filter_multiple_cubes
    constraint:
      operator: constraints.combine_constraints
      variable_constraint:
        operator: constraints.generate_var_constraint
        varname: $VARNAME
      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: []
        varname: $VARNAME


  - operator: feature.cell_stats
    threshold: 3
    save_data: True # save raw tracking data for further analysis

  # Filter tracking cubelist to one of "feature_mean", "feature_max", "feature_size", or "feature_effective_diameter"
  - operator: filters.filter_multiple_cubes
    constraint:
      operator: constraints.generate_var_constraint
      varname: feature_size
      # varname: feature_mean
      # varname: feature_max
      # varname: feature_effective_diameter

  - operator: plot.plot_histogram_series
    sequence_coordinate: realization # plots a single histogram across all times in input data
