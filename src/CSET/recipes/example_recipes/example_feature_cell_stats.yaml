category: Quick Look
title: Example running cell_stats and plotting histograms
description: |
  Uses the feature.cell_stats operator to calculate cell size, mean cell values and max cell values for identified features. Saves cell stats data to output and plots histograms

steps:
  - operator: read.read_cubes
    file_paths: $INPUT_PATHS
    model_names: $MODEL_NAME

  - operator: filters.filter_multiple_cubes
    constraint:
      operator: constraints.combine_constraints
      variable_constraint:
        operator: constraints.generate_var_constraint
        varname: $VARNAME
      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: []
        varname: $VARNAME


  - operator: feature.cell_stats
    threshold: 3
    save_data: True # save raw tracking data for further analysis

  # Filter tracking cubelist to one of "feature_mean", "feature_max", "feature_size", or "feature_effective_diameter"
  - operator: filters.filter_multiple_cubes
    constraint:
      operator: constraints.generate_var_constraint
      varname: feature_size
      # varname: feature_mean
      # varname: feature_max
      # varname: feature_effective_diameter

  - operator: plot.plot_histogram_series
    sequence_coordinate: realization # plots a single histogram across all times in input data
