category: Scores Spatial
title: "$COLLAPSE_METHOD $VARNAME\nScores Mean Error between the comparison model and $BASE_MODEL $SUBAREA_NAME"
description: |
  Extracts and plots the Mean Error (ME), which is also known as the Additive Bias, in $COLLAPSE_METHOD of $VARNAME.
  The ME is calculated based on that used in the
  package [`scores`](https://scores.readthedocs.io/en/stable/api.html#scores.continuous.mean_error).
  This recipe preserves the time, latitude and longitude coordinates.
  This means a sequence of spatial plots of the ME can be produced.
  Currently only working for deterministic models.

  This recipe calculates the ME. By default
  (COLLAPSE_METHOD = SEQ, or left blank), it keeps the time, latitude and
  longitude coordinates and produces a sequence of spatial ME plots, one
  per time point. Setting COLLAPSE_METHOD to MEAN, MAX, MIN, etc. instead
  collapses the time coordinate using that statistic, giving a single
  spatial plot per case study.

  A larger ME implies a greater error than a smaller ME. Although a near zero ME could be indicative
  of a good match between two fields, this could also arise if there are large compensating
  positive and negative  errors. The ME is calculated on the grid point and thus a spatial view of
  the ME provides useful information about whether a field has a bias for over or under-forecasting.

steps:
  - operator: read.read_cubes
    file_paths: $INPUT_PATHS
    model_names: [$BASE_MODEL, $OTHER_MODELS]
    constraint:
      operator: constraints.combine_constraints
      varname_constraint:
        operator: constraints.generate_var_constraint
        varname: $VARNAME
      cell_methods_constraint:
        operator: constraints.generate_cell_methods_constraint
        cell_methods: []
        varname: $VARNAME
      pressure_level_constraint:
        operator: constraints.generate_level_constraint
        coordinate: "pressure"
        levels: []
    subarea_type: $SUBAREA_TYPE
    subarea_extent: $SUBAREA_EXTENT

  - operator: misc.extract_common_time_points

    # The preserved coordinates specify whether or not the
    # ME is to be computed over the entire case study.
  - operator: scoreswrappers.scores_additive_bias
    preserved_coordinates: $PRESERVED_COORDS

    # This collapse is relevant only if the ME has not been
    # computed across the entire case study.
  - operator: collapse.collapse
    coordinate: ["time"]
    method: $COLLAPSE_METHOD

  - operator: plot.spatial_pcolormesh_plot

  - operator: write.write_cube_to_nc
    overwrite: True
